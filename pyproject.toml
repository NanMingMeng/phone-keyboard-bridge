[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-keyboard-bridge"
version = "0.2.1"
description = "Type on your phone and paste into the active window on your Windows PC over LAN."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NanMing" }]
keywords = ["keyboard", "phone", "clipboard", "windows", "lan", "codex"]
dependencies = [
  "pyperclip>=1.9.0",
  "Pillow>=10.0.0",
  "qrcode[pil]>=8.0",
  "PyQt6>=6.8",
]

[project.scripts]
phone-keyboard = "phone_keyboard.cli:main"

[tool.setuptools.packages.find]
include = ["phone_keyboard*", "desktop*"]

[tool.setuptools.package-data]
phone_keyboard = ["templates/*.html"]
