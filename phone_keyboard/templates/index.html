<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>手机键盘桥</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f8; --card:#fff; --text:#1f2933; --muted:#66727f; --border:#d9e2ec; --primary:#2f6fed; --soft:#eaf1ff; --danger:#b42318; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin:0; display:flex; flex-direction:column; min-height:100dvh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 16px 8px; flex:0 0 auto; }
  h1 { margin:0 0 6px; font-size:22px; font-weight:700; }
  header p { margin:0; color:var(--muted); font-size:13px; line-height:1.55; }
  .conn-pill { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:5px 10px; border-radius:999px; background:var(--soft); color:var(--primary); font-size:12px; font-weight:650; }
  .conn-pill::before { content:''; width:7px; height:7px; border-radius:50%; background:currentColor; }
  main { flex:1 1 auto; overflow-y:auto; padding:8px 14px 150px; }
  textarea { width:100%; height:150px; min-height:110px; padding:14px; border:1px solid var(--border); border-radius:16px; background:var(--card); color:var(--text); font-size:17px; line-height:1.55; resize:none; outline:none; }
  textarea:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  .row { display:flex; align-items:center; gap:8px; margin:10px 2px; color:#3e4c59; font-size:14px; }
  .row input { width:18px; height:18px; }
  .status { min-height:22px; margin:10px 2px 0; color:#0b6b3a; font-size:14px; line-height:1.55; white-space:pre-wrap; }
  .status.error { color:var(--danger); }
  .hint { margin:8px 2px 0; color:#7b8794; font-size:12px; line-height:1.55; }
  .preview-wrap { display:none; margin-top:12px; padding:10px; background:var(--card); border:1px solid var(--border); border-radius:16px; }
  .preview-wrap.visible { display:block; }
  #preview { display:block; max-width:100%; max-height:180px; border-radius:12px; margin:0 auto; }
  .bottom-wrap { position:fixed; left:0; right:0; bottom:0; z-index:30; background:rgba(255,255,255,.97); border-top:1px solid var(--border); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -8px 24px rgba(15,23,42,.08); backdrop-filter:blur(12px); }
  .image-actions { display:none; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .image-actions.visible { display:grid; }
  .bottom-bar { display:flex; align-items:center; gap:8px; }
  button { border:0; cursor:pointer; font:inherit; }
  .paste-btn { flex:1; min-height:50px; border-radius:15px; background:var(--primary); color:#fff; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; }
  .icon-btn { width:50px; height:50px; border-radius:15px; background:var(--soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
  .icon-btn.danger { color:var(--danger); background:#fff1f0; }
  .sub-btn { min-height:46px; border-radius:14px; background:var(--soft); color:var(--primary); font-weight:650; }
  .sub-btn.secondary { background:#e9edf2; color:#25313d; }
  button:disabled { opacity:.48; cursor:default; }
  svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .gate { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(244,246,248,.96); backdrop-filter:blur(8px); }
  .gate-panel { width:100%; max-width:420px; padding:24px; background:var(--card); border-radius:22px; border:1px solid var(--border); text-align:center; box-shadow:0 20px 60px rgba(15,23,42,.14); }
  .gate-title { margin:0 0 8px; font-size:20px; font-weight:700; }
  .gate-detail { margin:0; color:var(--muted); font-size:14px; line-height:1.65; }
  .retry-btn { margin-top:18px; width:100%; min-height:48px; border-radius:14px; background:var(--primary); color:#fff; font-weight:700; display:none; }
  .retry-btn.visible { display:block; }
  footer { display:none; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme:dark; --bg:#0e0e10; --card:#1c1c1e; --text:#f5f5f7; --muted:#9a9a9e; --border:#2c2c2e; --soft:#142b4a; --primary:#0a84ff; --danger:#ff6961; }
    .bottom-wrap { background:rgba(28,28,30,.97); }
    .sub-btn.secondary { background:#2c2c2e; color:#f5f5f7; }
    .icon-btn.danger { background:#3a1f1f; }
  }
</style>
</head>
<body>
<header>
  <h1>手机键盘桥</h1>
  <p>先在电脑上点一下目标输入框，再在手机上打字或选图片。</p>
  <div class="conn-pill" id="connState">等待连接</div>
</header>
<main>
  <textarea id="text" autofocus placeholder="在这里打字，支持中文输入法和语音输入……"></textarea>
  <label class="row"><input type="checkbox" id="enter"> 粘贴后按回车发送</label>
  <div class="preview-wrap" id="previewWrap"><img id="preview" alt="图片预览"></div>
  <p class="status" id="status"></p>
  <p class="hint">如果文字或图片去了错误的地方，先在电脑上点一下目标输入框，再重试一次。</p>
</main>
<div class="bottom-wrap" id="bottomWrap">
  <div class="image-actions" id="imageActions">
    <button class="sub-btn" id="sendImage">粘贴图片</button>
    <button class="sub-btn secondary" id="saveImage">只保存图片</button>
  </div>
  <div class="bottom-bar">
    <button class="paste-btn" id="paste" aria-label="粘贴到电脑"><svg viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M7.2 12.8l-1.7 1.7a3.7 3.7 0 0 0 5.2 5.2l1.7-1.7"/><path d="M16.8 11.2l1.7-1.7a3.7 3.7 0 0 0-5.2-5.2l-1.7 1.7"/></svg>粘贴到电脑</button>
    <button class="icon-btn" id="copy" aria-label="只复制" title="只复制"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="10" height="11" rx="2"/><path d="M6 15H5.5A1.5 1.5 0 0 1 4 13.5v-8A1.5 1.5 0 0 1 5.5 4h8A1.5 1.5 0 0 1 15 5.5V6"/></svg></button>
    <button class="icon-btn danger" id="clear" aria-label="清空" title="清空"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/><path d="M10 11v5M14 11v5"/></svg></button>
    <button class="icon-btn" id="imageBtn" aria-label="选择图片" title="选择图片"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.5"/><path d="M4.5 17l4.8-4.8 3.2 3.2 2.2-2.2 4.8 4.8"/></svg></button>
    <input type="file" id="image" accept="image/*" hidden>
  </div>
</div>
<div class="gate" id="gate"><div class="gate-panel"><h2 class="gate-title" id="gateTitle">正在连接电脑…</h2><p class="gate-detail" id="gateDetail">请保持手机和电脑在同一个网络。</p><button class="retry-btn" id="retry">重新申请</button></div></div>
<footer>Phone Keyboard Bridge v__VERSION__ · LAN only</footer>
<script>
const TOKEN = __TOKEN__;
const DEVICE_ID = (() => { let id = localStorage.getItem('pkb-device-id'); if (!id) { id = (crypto.randomUUID && crypto.randomUUID()) || ('pkb-' + Date.now() + '-' + Math.random().toString(16).slice(2)); localStorage.setItem('pkb-device-id', id); } return id; })();
const headers = { 'X-Token': TOKEN, 'X-Device-Id': DEVICE_ID };
const textEl = document.getElementById('text');
const statusEl = document.getElementById('status');
const connStateEl = document.getElementById('connState');
const enterEl = document.getElementById('enter');
const imageEl = document.getElementById('image');
const previewEl = document.getElementById('preview');
const previewWrap = document.getElementById('previewWrap');
const imageActions = document.getElementById('imageActions');
const gate = document.getElementById('gate');
const gateTitle = document.getElementById('gateTitle');
const gateDetail = document.getElementById('gateDetail');
const retryBtn = document.getElementById('retry');
const pasteBtn = document.getElementById('paste');
const copyBtn = document.getElementById('copy');
const clearBtn = document.getElementById('clear');
const imageBtn = document.getElementById('imageBtn');
const sendImageBtn = document.getElementById('sendImage');
const saveImageBtn = document.getElementById('saveImage');
let approved = false;
const saved = localStorage.getItem('phone-keyboard-text');
if (saved) textEl.value = saved;
textEl.addEventListener('input', () => localStorage.setItem('phone-keyboard-text', textEl.value));
function setStatus(message, isError) { statusEl.textContent = message; statusEl.classList.toggle('error', !!isError); }
function setConnState(text) { connStateEl.textContent = text; }
function showGate(title, detail, canRetry) { gateTitle.textContent = title; gateDetail.textContent = detail; retryBtn.classList.toggle('visible', !!canRetry); gate.style.display = 'flex'; }
function hideGate() { gate.style.display = 'none'; }
function setBusy(value) { [pasteBtn, copyBtn, clearBtn, imageBtn, sendImageBtn, saveImageBtn].forEach(btn => btn.disabled = value); }
async function sessionRequest(path) {
  const response = await fetch(path, { method: 'POST', headers, cache: 'no-store' });
  const data = await response.json().catch(() => ({}));
  if (!response.ok && data.state !== 'pending' && data.state !== 'denied') throw new Error(data.error || '连接失败');
  if (data.state === 'approved') { approved = true; hideGate(); setConnState('连接成功'); return true; }
  approved = false;
  if (data.state === 'pending') { setConnState('已扫码'); showGate('已扫码，等待电脑确认', '请在电脑上的 PKB 窗口点一次“允许连接”。', false); }
  else if (data.state === 'denied') { setConnState('已拒绝'); showGate('电脑已拒绝连接', '如果你仍然需要连接，可以点下面的“重新申请”。', true); }
  else if (data.state === 'invalid_link') { setConnState('链接无效'); showGate('连接链接无效', '请重新扫描电脑上最新的二维码。', false); }
  else { setConnState('连接失败'); showGate('连接失败', data.error || '请检查电脑端服务是否正在运行。', true); }
  return false;
}
async function syncSession() { try { await sessionRequest('/heartbeat'); } catch (error) { if (approved) { setConnState('已离线'); setStatus('电脑连接中断，请检查 PKB 是否仍在运行。', true); } else { showGate('连接失败', error.message || '无法连接电脑。', true); } approved = false; } }
async function sendText(mode) {
  if (!approved) { showGate('尚未连接', '请等待电脑确认后再发送。', false); return; }
  const text = textEl.value;
  if (!text.trim()) { setStatus('先输入一点文字。', true); return; }
  setBusy(true); setStatus('正在发送……');
  try {
    const response = await fetch('/send', { method:'POST', headers:{...headers,'Content-Type':'application/json'}, body:JSON.stringify({text,mode,enter:enterEl.checked}) });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || '发送失败');
    if (mode === 'paste') { textEl.value = ''; localStorage.removeItem('phone-keyboard-text'); textEl.focus(); setStatus('已粘贴到电脑，输入框已清空。'); }
    else setStatus('已复制到电脑剪贴板。');
  } catch (error) { setStatus(error.message || '发送失败', true); } finally { setBusy(false); }
}
async function sendImage(mode) {
  if (!approved) { showGate('尚未连接', '请等待电脑确认后再发送。', false); return; }
  const file = imageEl.files[0];
  if (!file) { setStatus('先选择一张图片。', true); return; }
  setBusy(true); setStatus(mode === 'paste' ? '正在发送图片……' : '正在保存图片……');
  try {
    const response = await fetch('/send-image', { method:'POST', headers:{...headers,'X-Filename':encodeURIComponent(file.name || 'image'),'X-Mode':mode}, body:file });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || '发送失败');
    if (data.pasted) setStatus('图片已粘贴到电脑。');
    else if (data.warning) setStatus(`图片已保存，但自动粘贴失败：${data.warning}\n保存位置：${data.path}`, true);
    else setStatus(`图片已保存：${data.path}`);
    resetImageSelection();
  } catch (error) { setStatus(error.message || '发送失败', true); } finally { setBusy(false); }
}
function resetImageSelection() { imageEl.value = ''; previewEl.removeAttribute('src'); previewWrap.classList.remove('visible'); imageActions.classList.remove('visible'); }
pasteBtn.addEventListener('click', () => sendText('paste'));
copyBtn.addEventListener('click', () => sendText('copy'));
clearBtn.addEventListener('click', () => { textEl.value = ''; localStorage.removeItem('phone-keyboard-text'); textEl.focus(); setStatus('已清空。'); });
imageBtn.addEventListener('click', () => imageEl.click());
imageEl.addEventListener('change', () => { const file = imageEl.files[0]; if (!file) { resetImageSelection(); return; } previewEl.src = URL.createObjectURL(file); previewWrap.classList.add('visible'); imageActions.classList.add('visible'); setStatus('已选择图片：' + file.name + '。请选择“粘贴图片”或“只保存图片”。'); });
sendImageBtn.addEventListener('click', () => sendImage('paste'));
saveImageBtn.addEventListener('click', () => sendImage('save'));
retryBtn.addEventListener('click', async () => { retryBtn.disabled = true; try { await sessionRequest('/request-access'); } catch (error) { showGate('申请失败', error.message || '请稍后再试。', true); } finally { retryBtn.disabled = false; } });
(async () => { try { await sessionRequest('/session'); } catch (error) { showGate('连接失败', error.message || '请检查电脑端服务。', true); } setInterval(syncSession, 4000); })();
</script>
</body>
</html>
