name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PKB --icon assets/icon.ico --add-data "phone_keyboard/templates;phone_keyboard/templates" --add-data "assets;assets" --hidden-import PyQt6.QtSvg --hidden-import PyQt6.QtSvgWidgets run_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: PKB-windows
          path: dist/PKB.exe
